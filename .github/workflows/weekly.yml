name: weekly-knowledge

# 每週自動更新皮克敏知識:收集 → (選配)中文整理 → 驗證出處 → 建站 → 自動 commit。
# GitHub Pages 只讀 knowledge.json 顯示;「每週更新」全由本 workflow 完成。

on:
  schedule:
    # UTC 週日 21:00 = 台北週一 05:00,每週一次
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "本次最多收集幾個新頁面"
        default: "20"
      refresh:
        description: "連已收集的頁面也重抓(true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: weekly-knowledge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 收集腳本零依賴;anthropic 只給選配的 curate.py 用
      - name: Install deps
        run: pip install anthropic

      # 步驟 1:讀 Docs/topics.md 佇列,從 Pikipedia 抓新頁面,合併進 Docs/knowledge.json
      - name: Collect from Pikipedia
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '20' }}"
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then ARGS="$ARGS --refresh"; fi
          python Py/collect_pikipedia.py $ARGS
        continue-on-error: true

      # 步驟 2(選配):有 ANTHROPIC_API_KEY secret 才會整理;沒有就自動略過
      - name: Curate into Chinese (optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python Py/curate.py
        continue-on-error: true

      # 步驟 3:逐筆連回出處驗證。失效會 exit 2 但不擋 pipeline,前端標「⚠ 連結待確認」
      - name: Verify source links
        run: python Py/verify_sources.py
        continue-on-error: true

      # 步驟 4:正規化 → 根 knowledge.json + zh-hant/ 主題頁、條目頁、來源頁 + 舊網址轉址頁 + sitemap + 首頁注入
      - name: Build site
        run: python Py/build_site.py

      # 步驟 5:有變動才 commit + push
      - name: Commit changes
        run: |
          git config user.name  "pluckpi-bot"
          git config user.email "pluckpi-bot@users.noreply.github.com"
          git add Docs/knowledge.json Docs/link_report.json knowledge.json sitemap.xml index.html
          git add -A zh-hant/ topics/ sources/
          if git diff --cached --quiet; then
            echo "無變動,略過 commit"
          else
            git commit -m "chore: 每週更新皮克敏知識 (knowledge.json)"
            git push
          fi
